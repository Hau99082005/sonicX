<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Xác nhận mật khẩu - sonicX</title>
  </head>
  <body>
    <h1 id="loader">Vui lòng đợi</h1>

    <div id="container">
      <h2>Xác nhận mật khẩu</h2>
      <form id="form">
        <div class="notification-container" id="error"></div>
        <div class="notification-container" id="success"></div>
        <div class="form-group">
          <label for="password">Mật khẩu mới:</label>
          <input type="password" id="password" name="password" />
        </div>
        <div class="form-group">
          <label for="confirm-password">Xác nhận mật khẩu mới:</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
          />
        </div>
        <button id="submit" type="submit">Đặt lại mật khẩu</button>
      </form>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
